name: Dependency security audit

on:
  pull_request:
    paths:
      - "**/Cargo.toml"
      - Cargo.lock
  # Every push to master, not only one that touches a Cargo file: the release
  # workflow requires this audit on the exact commit it tags.
  push:
    branches: [master]
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  rustsec:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # cargo-audit at a fixed version, built from its own lockfile. Built
      # unlocked, it took the newest releases of its dependencies; on
      # 2026-11-22 those required a newer Rust than this repository's
      # toolchain and the audit failed to compile, so no release could be
      # tagged. The audit itself is unchanged: a vulnerability fails it.
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.23.0 --locked
      - name: Audit Cargo.lock
        run: cargo audit
