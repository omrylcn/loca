name: Weekly lint on latest stable Rust

# An early warning, not a gate: the pinned toolchain in rust-toolchain.toml
# (and in ci.yml) stays what CI and releases build with. This run shows what
# the next stable Rust's rustfmt and clippy will ask for before the pin moves.
# It never runs on push or pull request, so it cannot block a merge, and no
# release workflow waits for it. A failure is the red run in the Actions tab;
# it opens no issue (no workflow here writes issues itself).

on:
  schedule:
    - cron: "29 5 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: rustfmt and clippy on latest stable
    # GitHub CI runs only in the public repository.
    if: github.repository == 'omrylcn/loca'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Overrides rust-toolchain.toml, which would otherwise select the pin.
      RUSTUP_TOOLCHAIN: stable
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; toolchain below
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Install build dependencies
        # The skill-bundles build script needs zip.
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Toolchain in use
        run: |
          rustc --version
          cargo fmt --version
          cargo clippy --version

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        # Also when Format failed, so one run shows both results.
        if: ${{ !cancelled() }}
        run: cargo clippy --workspace --all-targets -- -D warnings
