name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Verify tag and changelog
        run: |
          ./scripts/check-release.sh "$GITHUB_REF_NAME"
          git merge-base --is-ancestor \
            "$(git rev-list -n 1 "$GITHUB_REF_NAME")" origin/master

      - name: Re-run release gates
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s skill/agent-room/tests -v
          ./scripts/smoke.sh

      - name: Build release artifacts
        run: |
          version="$(./scripts/version.sh)"
          cargo build --workspace --release --locked
          ./scripts/build-remote-agent-kit.sh
          mkdir -p dist/release/loca-"$version"-linux-amd64
          install -m 0755 target/release/room-server \
            dist/release/loca-"$version"-linux-amd64/
          install -m 0755 target/release/loca-admin \
            dist/release/loca-"$version"-linux-amd64/
          cp LICENSE README.md PRODUCTION.md \
            dist/release/loca-"$version"-linux-amd64/
          tar -C dist/release -czf \
            dist/release/loca-"$version"-linux-amd64.tar.gz \
            loca-"$version"-linux-amd64
          mv dist/loca-remote-agent.zip \
            dist/release/loca-remote-agent-"$version".zip

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: dist/release/loca-${{ github.ref_name }}.spdx.json

      - name: Generate checksums
        run: |
          cd dist/release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS

      - name: Attest release artifacts
        # GitHub rejects attestations for user-owned private repositories.
        # Keep the release usable while private; the same immutable workflow
        # begins publishing provenance automatically when the repo is public.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: "dist/release/*"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          generate_release_notes: true
          files: dist/release/*
