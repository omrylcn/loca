name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing signed release tag to publish
        required: true
        type: string
  push:
    tags:
      - "v*"

permissions:
  actions: read
  contents: write
  id-token: write
  attestations: write

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; toolchain below
        with:
          toolchain: "1.94.1" # keep aligned with rust-toolchain.toml
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install release dependencies
        run: sudo apt-get update && sudo apt-get install -y jq zip

      - name: Verify tag and changelog
        run: |
          ./scripts/check-release.sh "$RELEASE_TAG"
          git merge-base --is-ancestor \
            "$(git rev-list -n 1 "$RELEASE_TAG")" origin/master

      - name: Re-run release gates
        run: |
          cargo fmt --check
          cargo clippy --workspace --all-targets -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s skill/agent-room/tests -v
          ./scripts/smoke.sh

      - name: Require successful sibling workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/require-release-workflows.sh \
            "$(git rev-list -n 1 "$RELEASE_TAG")"

      - name: Build release artifacts
        run: |
          version="$(./scripts/version.sh)"
          cargo build --workspace --release --locked
          ./scripts/build-remote-agent-kit.sh
          mkdir -p dist/release/loca-"$version"-linux-amd64
          install -m 0755 target/release/room-server \
            dist/release/loca-"$version"-linux-amd64/
          install -m 0755 target/release/loca-admin \
            dist/release/loca-"$version"-linux-amd64/
          cp LICENSE README.md PRODUCTION.md \
            dist/release/loca-"$version"-linux-amd64/
          mkdir -p dist/release/loca-"$version"-linux-amd64/{scripts,docs}
          install -m 0755 scripts/storage_snapshot.py \
            dist/release/loca-"$version"-linux-amd64/scripts/
          install -m 0644 docs/backup-restore.md \
            dist/release/loca-"$version"-linux-amd64/docs/
          tar -C dist/release -czf \
            dist/release/loca-"$version"-linux-amd64.tar.gz \
            loca-"$version"-linux-amd64
          mv dist/loca-remote-agent.zip \
            dist/release/loca-remote-agent-"$version".zip

      - name: Gate exact release ZIP against the release server
        run: |
          python3 scripts/onboarding-e2e.py \
            --binary target/release/room-server \
            --archive "dist/release/loca-remote-agent-$(./scripts/version.sh).zip"

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          path: .
          format: spdx-json
          output-file: dist/release/loca-${{ env.RELEASE_TAG }}.spdx.json

      - name: Generate checksums
        run: |
          cd dist/release
          find . -maxdepth 1 -type f ! -name SHA256SUMS -print0 |
            sort -z |
            xargs -0 sha256sum > SHA256SUMS

      - name: Attest release artifacts
        # GitHub rejects attestations for user-owned private repositories.
        # Keep the release usable while private; the same immutable workflow
        # begins publishing provenance automatically when the repo is public.
        if: github.event.repository.private == false
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/release/*"

      # A draft, not a publication. The artifacts are built and gated above;
      # making them public is a separate, approved step after the draft's
      # assets have been downloaded and checked (docs/release-protocol.md):
      #   gh release edit "$RELEASE_TAG" --draft=false
      # scripts/check-release.sh refuses this workflow without `draft: true`.
      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          draft: true
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: dist/release/*
