name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck zip

      - name: Repository quality gates
        run: make check

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Configure official Docker Hub cache
        # Keep existing daemon settings; cache misses still use Docker Hub.
        # Base image digests in Dockerfile preserve image identity.
        run: |
          config=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$config"
          else
            echo '{}' > "$config"
          fi
          jq '. + {"registry-mirrors": (["https://mirror.gcr.io"] + (."registry-mirrors" // []) | unique)}' "$config" > "$config.updated"
          sudo install -m 0644 "$config.updated" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - run: make container-check

  browser:
    name: Browser identity and reconnect
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make browser-check
