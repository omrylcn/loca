name: CI

on:
  push:
    branches: [dev, master]
  pull_request:
    branches: [dev, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test, and package
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; toolchain below
        with:
          toolchain: "1.94.1" # keep aligned with rust-toolchain.toml
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install system test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq shellcheck zip

      - name: Repository quality gates
        run: make check

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Configure official Docker Hub cache
        # Keep existing daemon settings; cache misses still use Docker Hub.
        # Base image digests in Dockerfile preserve image identity.
        run: |
          config=$(mktemp)
          if sudo test -f /etc/docker/daemon.json; then
            sudo cat /etc/docker/daemon.json > "$config"
          else
            echo '{}' > "$config"
          fi
          jq '. + {"registry-mirrors": (["https://mirror.gcr.io"] + (."registry-mirrors" // []) | unique)}' "$config" > "$config.updated"
          sudo install -m 0644 "$config.updated" /etc/docker/daemon.json
          sudo systemctl restart docker
          docker info --format '{{json .RegistryConfig.Mirrors}}'
      - run: make container-check

  # The browser suite in four parts at once: on one runner it took about 15
  # minutes and the Chromium download up to 5 more, and a 20-minute limit
  # cancelled master twice with every test passing so far. Each part has its
  # own runner, server and data; Playwright splits the suite by file.
  browser-shard:
    name: Browser part ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # pinned action; toolchain below
        with:
          toolchain: "1.94.1" # keep aligned with rust-toolchain.toml
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: make browser-check SHARD=${{ matrix.shard }}/4

  # The required check keeps its name: green only when every part is.
  browser:
    name: Browser identity and reconnect
    needs: browser-shard
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every part passed
        env:
          RESULT: ${{ needs.browser-shard.result }}
        run: test "$RESULT" = success
