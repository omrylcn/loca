[workspace]
resolver = "2"
members = ["crates/protocol", "crates/server", "crates/admin", "crates/skill-bundles"]

[workspace.package]
version = "0.8.5"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
