[package]
name = "server"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "room-server"
path = "src/main.rs"

[dependencies]
protocol = { path = "../protocol" }
skill-bundles = { path = "../skill-bundles" }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
axum = { version = "0.7", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
tower-http = { version = "0.5", features = ["cors"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rusqlite = { version = "0.31", features = ["bundled"] }
rand = "0.8"
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# ReplaceFileW for atomic blob replacement on the Desktop (Windows) build; the
# no-follow read/delete use std custom_flags and need no extra crate.
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

[dev-dependencies]
tempfile = "3"
rusqlite = { version = "0.31", features = ["bundled"] }
tokio-tungstenite = "0.24"
reqwest = { version = "0.12", default-features = false, features = ["json", "charset", "http2"] }
sha2 = "0.10"
