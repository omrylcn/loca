[package]
name = "skill-bundles"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The embedded loca/loca-care skill distribution bundles, shared by the server download endpoint and the Desktop local Skill Library so both serve identical bytes."

[dependencies]
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"
